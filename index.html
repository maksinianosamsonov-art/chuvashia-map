<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Календарь Дарьи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0a0f1d',
            secondary: '#121b2d',
            accent: '#ff2ea6',
            neon: '#00f5d4',
            violet: '#8b5cf6',
            success: '#10b981',
            warning: '#f59e0b',
            danger: '#ef4444'
          },
          fontFamily: {
            orbitron: ['Orbitron', 'monospace'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0a0f1d 0%, #121b2d 100%);
      color: white;
      margin: 0;
      min-height: 100vh;
      overflow-y: auto;
    }
    .neon-text { text-shadow: 0 0 10px #ff2ea6, 0 0 20px #ff2ea6; }
    .neon-text-cyan { text-shadow: 0 0 10px #00f5d4, 0 0 20px #00f5d4; }
    
    .cycle-ring {
      width: 160px; height: 160px;
      border-radius: 50%;
      background: conic-gradient(#ff2ea6 var(--prog, 0%), #1e293b var(--prog, 0%));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 25px rgba(255, 46, 166, 0.4);
      transition: background 0.5s ease;
    }
    .cycle-ring .inner {
      width: 125px; height: 125px;
      background: #0a0f1d;
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 2px solid #1e293b;
    }
    
    .day-cell {
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      font-size: 14px; font-weight: 600;
      position: relative; cursor: pointer;
      transition: all 0.15s ease;
      background: #1e293b;
      color: #cbd5e1;
    }
    .day-cell:active { transform: scale(0.92); }
    .day-cell.empty { background: transparent; cursor: default; }
    .day-cell.today { border: 2px solid #00f5d4; color: #00f5d4; }
    .day-cell.mood-rejected { background: #ff2ea6; color: white; box-shadow: 0 0 10px rgba(255, 46, 166, 0.5); }
    .day-cell.mood-bad { background: #f59e0b; color: white; box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
    .day-cell.mood-good { background: #10b981; color: white; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
    .day-cell.future-pred {
      background: repeating-linear-gradient(45deg, #1e293b, #1e293b 4px, #334155 4px, #334155 8px);
      color: #94a3b8; border: 1px dashed #475569;
    }
    .day-cell .emoji { font-size: 16px; position: absolute; top: -6px; right: -6px; }

    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      z-index: 200; padding: 20px;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: #121b2d; border: 1px solid #334155; border-radius: 24px; padding: 24px;
      width: 100%; max-width: 340px;
      animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .opt {
      padding: 14px; border-radius: 14px; border: 1px solid #334155;
      background: #0a0f1d; cursor: pointer;
      display: flex; align-items: center; gap: 12px;
      font-size: 15px; font-weight: 600; color: white;
      transition: all 0.15s;
    }
    .opt:active { transform: scale(0.97); }
    .opt-reject { border-color: #ff2ea6; } .opt-reject:active { background: rgba(255, 46, 166, 0.2); }
    .opt-bad { border-color: #f59e0b; } .opt-bad:active { background: rgba(245, 158, 11, 0.2); }
    .opt-good { border-color: #10b981; } .opt-good:active { background: rgba(16, 185, 129, 0.2); }
  </style>
</head>
<body class="pb-28">

  <div id="app" class="w-full max-w-md mx-auto p-4">
    <!-- Header -->
    <div class="text-center mb-6 mt-2">
      <h1 class="text-2xl font-black neon-text font-orbitron tracking-wider mb-1">КАЛЕНДАРЬ ДАРЬИ</h1>
      <p id="subtitle" class="text-gray-400 text-sm font-medium">Слежу за настроением...</p>
    </div>

    <!-- Cycle Ring -->
    <div class="flex justify-center mb-6">
      <div class="cycle-ring" id="cycleRing">
        <div class="inner">
          <div class="text-3xl font-black text-accent font-orbitron" id="cycleDay">—</div>
          <div class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">день цикла</div>
          <div class="text-2xl mt-1" id="currentMood">🤷</div>
        </div>
      </div>
    </div>

    <!-- Forecast -->
    <div class="bg-secondary/80 backdrop-blur border border-gray-700 rounded-2xl p-4 mb-4">
      <h3 class="text-xs font-bold text-neon uppercase tracking-wider mb-3 font-orbitron">🔮 Прогноз настроения</h3>
      <div id="forecastList" class="space-y-2">
        <div class="text-gray-400 text-sm text-center py-2">Добавь первые отметки, и я построю прогноз</div>
      </div>
    </div>

    <!-- Calendar -->
    <div class="bg-secondary/80 backdrop-blur border border-gray-700 rounded-2xl p-4 mb-4">
      <div class="flex justify-between items-center mb-4">
        <button id="prevMonth" class="w-8 h-8 rounded-full bg-primary border border-gray-600 text-neon flex items-center justify-center text-lg">‹</button>
        <div class="text-lg font-bold font-orbitron text-white capitalize" id="monthLabel"></div>
        <button id="nextMonth" class="w-8 h-8 rounded-full bg-primary border border-gray-600 text-neon flex items-center justify-center text-lg">›</button>
      </div>
      
      <div class="grid grid-cols-7 gap-1 text-center text-xs text-gray-500 font-bold mb-2">
        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
      </div>
      <div class="grid grid-cols-7 gap-2" id="daysGrid"></div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-secondary/80 border border-gray-700 rounded-2xl p-3 text-center">
        <div class="text-xl font-black text-accent font-orbitron" id="statReject">0</div>
        <div class="text-[10px] text-gray-400 uppercase tracking-wider mt-1">Отшит</div>
      </div>
      <div class="bg-secondary/80 border border-gray-700 rounded-2xl p-3 text-center">
        <div class="text-xl font-black text-warning font-orbitron" id="statBad">0</div>
        <div class="text-[10px] text-gray-400 uppercase tracking-wider mt-1">Без настр.</div>
      </div>
      <div class="bg-secondary/80 border border-gray-700 rounded-2xl p-3 text-center">
        <div class="text-xl font-black text-success font-orbitron" id="statGood">0</div>
        <div class="text-[10px] text-gray-400 uppercase tracking-wider mt-1">В настр.</div>
      </div>
    </div>

    <button id="resetBtn" class="w-full text-center text-gray-600 text-xs underline pb-4">Сбросить все данные</button>
  </div>

  <!-- FAB Buttons -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 flex gap-3 bg-secondary/90 backdrop-blur-xl border border-gray-700 p-2 rounded-full shadow-2xl z-50">
    <button onclick="markToday('rejected')" class="w-14 h-14 rounded-full bg-accent flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(255,46,166,0.5)] active:scale-90 transition-transform">💔</button>
    <button onclick="markToday('bad')" class="w-14 h-14 rounded-full bg-warning flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(245,158,11,0.5)] active:scale-90 transition-transform">😔</button>
    <button onclick="markToday('good')" class="w-14 h-14 rounded-full bg-success flex items-center justify-center text-2xl shadow-[0_0_15px_rgba(16,185,129,0.5)] active:scale-90 transition-transform">💖</button>
  </div>

  <!-- Modal -->
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3 class="text-lg font-bold text-center text-white mb-4 font-orbitron" id="modalTitle">Выбери настроение</h3>
      <div class="space-y-3">
        <div class="opt opt-reject" onclick="setMood('rejected')"><span class="text-2xl">💔</span><span>Отшила</span></div>
        <div class="opt opt-bad" onclick="setMood('bad')"><span class="text-2xl">😔</span><span>Без настроения</span></div>
        <div class="opt opt-good" onclick="setMood('good')"><span class="text-2xl">💖</span><span>В настроении</span></div>
        <div class="opt border-gray-600" onclick="setMood(null)"><span class="text-2xl">🗑️</span><span>Убрать отметку</span></div>
      </div>
      <button class="w-full mt-4 py-3 rounded-xl bg-gray-800 text-gray-400 font-semibold active:bg-gray-700 transition-colors" onclick="closeModal()">Отмена</button>
    </div>
  </div>

  <script>
    // 1. Telegram WebApp Init
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0a0f1d');
      tg.setBackgroundColor('#0a0f1d');
      tg.disableVerticalSwipes(); // Prevent pull-to-refresh in TG
    }

    // 2. State & Data
    const STORAGE_KEY = 'darya_calendar_twa_v1';
    const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
    
    let data = loadData();
    let viewDate = new Date();
    let selectedDate = null;

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      return { entries: {} };
    }
    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function dateKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    function todayKey() { return dateKey(new Date()); }
    function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
    function formatDate(d) { return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }

    // 3. Actions
    function markToday(mood) {
      data.entries[todayKey()] = mood;
      saveData();
      render();
      if (tg) tg.HapticFeedback.impactOccurred('light');
    }

    function openModal(dateStr) {
      selectedDate = dateStr;
      document.getElementById('modalTitle').textContent = formatDate(new Date(dateStr + 'T00:00:00'));
      document.getElementById('modalBg').classList.add('show');
      if (tg) tg.HapticFeedback.selectionChanged();
    }
    function closeModal() {
      document.getElementById('modalBg').classList.remove('show');
      selectedDate = null;
    }
    function setMood(mood) {
      if (!selectedDate) return;
      if (mood === null) delete data.entries[selectedDate];
      else data.entries[selectedDate] = mood;
      saveData();
      closeModal();
      render();
      if (tg) tg.HapticFeedback.notificationOccurred('success');
    }

    // 4. Analysis & Prediction Logic
    function analyzeCycle() {
      const entries = Object.entries(data.entries)
        .map(([k, v]) => ({ date: new Date(k + 'T00:00:00'), mood: v, key: k }))
        .sort((a, b) => a.date - b.date);

      const badDays = entries.filter(e => e.mood === 'rejected' || e.mood === 'bad');
      let avgCycle = 7, badPhaseLen = 2, lastBad = null;

      if (badDays.length >= 2) {
        lastBad = badDays[badDays.length - 1].date;
        const gaps = [];
        for (let i = 1; i < badDays.length; i++) {
          const gap = daysBetween(badDays[i-1].date, badDays[i].date);
          if (gap > 0 && gap < 60) gaps.push(gap);
        }
        if (gaps.length > 0) avgCycle = gaps.reduce((a,b)=>a+b,0) / gaps.length;

        const clusters = [];
        let cur = [badDays[0]];
        for (let i = 1; i < badDays.length; i++) {
          if (daysBetween(badDays[i-1].date, badDays[i].date) <= 2) cur.push(badDays[i]);
          else { clusters.push(cur); cur = [badDays[i]]; }
        }
        clusters.push(cur);
        badPhaseLen = Math.max(1, Math.round(clusters.map(c => c.length).reduce((a,b)=>a+b,0) / clusters.length));
      } else if (badDays.length === 1) {
        lastBad = badDays[0].date;
      }

      return { avgCycle, badPhaseLen, lastBad, total: entries.length };
    }

    function predictNextDays() {
      const { avgCycle, badPhaseLen, lastBad } = analyzeCycle();
      const today = new Date(); today.setHours(0,0,0,0);
      const predictions = [];
      if (!lastBad) return predictions;

      let nextStart = new Date(lastBad);
      nextStart.setDate(nextStart.getDate() + Math.round(avgCycle));
      while (nextStart <= today) nextStart.setDate(nextStart.getDate() + Math.round(avgCycle));

      for (let cycle = 0; cycle < 3; cycle++) {
        const start = new Date(nextStart);
        start.setDate(start.getDate() + cycle * Math.round(avgCycle));
        predictions.push({ date: new Date(start), type: 'bad', text: `Ожидается отшив / без настр.`, emoji: '💔' });
        
        const goodStart = new Date(start);
        goodStart.setDate(goodStart.getDate() + badPhaseLen);
        predictions.push({ date: new Date(goodStart), type: 'good', text: `Возможно, будет в настроении`, emoji: '💖' });
      }
      return predictions;
    }

    // 5. Rendering
    function renderForecast() {
      const list = document.getElementById('forecastList');
      const preds = predictNextDays();
      if (preds.length === 0) {
        list.innerHTML = '<div class="text-gray-400 text-sm text-center py-2">Добавь первые отметки, и я построю прогноз 🔮</div>';
        return;
      }
      list.innerHTML = preds.slice(0, 4).map(p => `
        <div class="flex items-center gap-3 p-2 rounded-xl bg-primary/50 border border-gray-700/50">
          <span class="text-xl">${p.emoji}</span>
          <div class="flex-1">
            <div class="text-xs text-gray-400">${p.date.getDate()} ${MONTHS[p.date.getMonth()].slice(0,3)}</div>
            <div class="text-sm font-semibold text-white">${p.text}</div>
          </div>
        </div>
      `).join('');
    }

    function renderCycleRing() {
      const { avgCycle, lastBad, badPhaseLen } = analyzeCycle();
      const ring = document.getElementById('cycleRing');
      const dayEl = document.getElementById('cycleDay');
      const moodEl = document.getElementById('currentMood');
      const sub = document.getElementById('subtitle');
      const today = new Date(); today.setHours(0,0,0,0);
      const todayMood = data.entries[todayKey()];

      if (!lastBad) {
        ring.style.setProperty('--prog', '0%');
        dayEl.textContent = '—'; moodEl.textContent = '🤷';
        sub.textContent = 'Отметь первую дату — и цикл запустится';
        return;
      }

      const daysSince = daysBetween(lastBad, today);
      const cycleDay = (daysSince % Math.round(avgCycle)) + 1;
      const prog = (cycleDay / Math.round(avgCycle)) * 100;

      ring.style.setProperty('--prog', prog + '%');
      dayEl.textContent = cycleDay;

      if (todayMood === 'rejected') moodEl.textContent = '💔';
      else if (todayMood === 'bad') moodEl.textContent = '😔';
      else if (todayMood === 'good') moodEl.textContent = '💖';
      else if (cycleDay <= badPhaseLen) moodEl.textContent = '⚠️';
      else moodEl.textContent = '✨';

      if (todayMood) sub.textContent = `Сегодня: ${todayMood === 'rejected' ? 'отшила' : todayMood === 'bad' ? 'без настроения' : 'в настроении'}`;
      else if (cycleDay <= badPhaseLen) sub.textContent = `⚠️ Опасная зона! Будь начеку`;
      else sub.textContent = `До следующего отшива ~${Math.round(avgCycle) - cycleDay} дн.`;
    }

    function renderCalendar() {
      const grid = document.getElementById('daysGrid');
      const label = document.getElementById('monthLabel');
      const year = viewDate.getFullYear(), month = viewDate.getMonth();
      label.textContent = `${MONTHS[month]} ${year}`;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month+1, 0);
      let startOffset = (firstDay.getDay() + 6) % 7;
      const todayK = todayKey();

      const preds = predictNextDays();
      const predMap = {};
      const { badPhaseLen } = analyzeCycle();
      preds.forEach(p => {
        predMap[dateKey(p.date)] = p.type;
        for (let i = 1; i < badPhaseLen; i++) {
          const d = new Date(p.date); d.setDate(d.getDate() + i);
          predMap[dateKey(d)] = p.type;
        }
      });

      let html = '';
      for (let i = 0; i < startOffset; i++) html += '<div class="day-cell empty"></div>';

      for (let d = 1; d <= lastDay.getDate(); d++) {
        const date = new Date(year, month, d);
        const key = dateKey(date);
        const mood = data.entries[key];
        const isToday = key === todayK;
        const isFuture = date > new Date(); isFuture && date.setHours(0,0,0,0) >= new Date().setHours(0,0,0,0); // fix timezone edge
        const pred = predMap[key];

        let cls = 'day-cell';
        if (mood === 'rejected') cls += ' mood-rejected';
        else if (mood === 'bad') cls += ' mood-bad';
        else if (mood === 'good') cls += ' mood-good';
        else if (isFuture && pred) cls += ' future-pred';
        else if (isToday) cls += ' today';

        let emoji = '';
        if (mood === 'rejected') emoji = '<span class="emoji">💔</span>';
        else if (mood === 'bad') emoji = '<span class="emoji">😔</span>';
        else if (mood === 'good') emoji = '<span class="emoji">💖</span>';
        else if (isFuture && pred === 'bad') emoji = '<span class="emoji">⚠️</span>';
        else if (isFuture && pred === 'good') emoji = '<span class="emoji">✨</span>';

        html += `<div class="${cls}" onclick="openModal('${key}')">${d}${emoji}</div>`;
      }
      grid.innerHTML = html;
    }

    function renderStats() {
      const entries = Object.values(data.entries);
      document.getElementById('statReject').textContent = entries.filter(e => e === 'rejected').length;
      document.getElementById('statBad').textContent = entries.filter(e => e === 'bad').length;
      document.getElementById('statGood').textContent = entries.filter(e => e === 'good').length;
    }

    function render() {
      renderCycleRing();
      renderForecast();
      renderCalendar();
      renderStats();
    }

    // 6. Event Listeners
    document.getElementById('prevMonth').onclick = () => { viewDate.setMonth(viewDate.getMonth() - 1); render(); };
    document.getElementById('nextMonth').onclick = () => { viewDate.setMonth(viewDate.getMonth() + 1); render(); };
    document.getElementById('resetBtn').onclick = () => {
      if (confirm('Точно стереть все отметки?')) {
        data = { entries: {} };
        saveData();
        render();
        if (tg) tg.HapticFeedback.notificationOccurred('warning');
      }
    };

    // Initial render
    render();
  </script>
</body>
</html>
